name: Build Cross-Platform Releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aweyuki-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aweyuki-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: aweyuki-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: aweyuki-macos-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: aweyuki-cli-linux-aarch64-termux-compat
            cli_only: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI system packages
        if: matrix.os == 'ubuntu-latest' && !matrix.cli_only
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install musl cross linker for aarch64 CLI
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p aweyuki-cli

      - name: Build Native wgpu GUI
        if: "!matrix.cli_only"
        run: cargo build --release --target ${{ matrix.target }} -p aweyuki-gui

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/aweyuki* dist/ 2>/dev/null || true
          if [ "${{ matrix.cli_only }}" != "true" ]; then
            cp target/${{ matrix.target }}/release/aweyuki-gui* dist/ 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  build-web-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: ./web-demo/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aweyuki-web-demo
          path: web-demo/
