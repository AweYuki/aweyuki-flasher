[package]
name = "aweyuki-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
byteorder = "1.5"
sha2 = "0.10"
crc32fast = "1.4"
hex = "0.4"
prost = "0.13"
lzma-rs = "0.3"
ruzstd = "0.7"
bzip2-rs = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
